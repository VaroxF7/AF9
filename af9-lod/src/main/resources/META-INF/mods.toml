modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    authors = "${mod_author}"
    description = '''
GPU-driven distant terrain (LOD) renderer for AMD and NVIDIA. Clean-room, OpenGL 4.6 compute culling and
indirect draws, designed to work with Embeddium and Oculus shader packs.
'''

    [[dependencies.${mod_id}]]
        modId = "forge"
        mandatory = true
        versionRange = "[${forge_version},)"
        ordering = "NONE"
        side = "CLIENT"
    [[dependencies.${mod_id}]]
        modId = "minecraft"
        mandatory = true
        versionRange = "[${minecraft_version},)"
        ordering = "NONE"
        side = "CLIENT"
