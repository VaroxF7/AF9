plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

repositories {
    // dev runs only: jars of a pack instance (-Paf9Instance=<its folder>), see the runs below
    if (project.hasProperty('af9Instance')) {
        flatDir { dirs "${project.property('af9Instance')}/mods" }
    }
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
        }
    }
    maven { // Curios (GT's Rubber Gloves go in its hands slot)
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven { // Ad Astra (the orbital station's magnetic field sets gravity through its API)
        name = 'Resourceful'
        url = 'https://maven.teamresourceful.com/repository/maven-public/'
        content {
            includeGroup 'earth.terrarium.adastra'
        }
    }
    maven { // Jade (the same coordinates GTCEu builds against)
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

sourceSets {
    // dev runs only, not in the jar: writes down what the game has registered (RegistryDump)
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    devtestImplementation.extendsFrom implementation
    devtestRuntimeOnly.extendsFrom runtimeOnly
}

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version
    addModdingDependenciesTo(sourceSets.devtest)

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.devtest)
        }
    }

    runs {
        // A headless boot for checking what AF9 Core registers: mod loading, the registries, common setup and a server's
        // data packs, then it stops (no window, no world kept). Needs the mods AF9 Core depends on at runtime, and takes
        // KubeJS along, so the pack's scripts in run/kubejs are loaded as well:
        //   ./gradlew runGameTestServer -Paf9Instance=<folder of a pack instance> [-Paf9Dump=<file>]
        // With af9Dump, everything registered is written to that file (devtest source set, RegistryDump).
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = file('run')
            systemProperty 'af9.dump', (project.findProperty('af9Dump') ?: '').toString()
        }
    }
}

dependencies {
    // GregTech and the libraries its API exposes
    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    // Jade tooltips of the AF9 machines (the pack runs a newer 11.x; the API used here is unchanged)
    modCompileOnly("maven.modrinth:jade:${jade_version}")
    // gloves worn in a Curios slot protect wafers too (optional at runtime)
    modCompileOnly("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    // the orbital station's magnetic field (optional at runtime)
    modCompileOnly("earth.terrarium.adastra:ad_astra-forge-${minecraft_version}:${ad_astra_version}") { transitive = false }

    // dev runs only: the mods AF9 Core needs at runtime that are not on a maven above, taken from a pack instance
    if (project.hasProperty('af9Instance')) {
        modRuntimeOnly("earth.terrarium.adastra:ad_astra-forge-${minecraft_version}:${ad_astra_version}") { transitive = false }
        modRuntimeOnly "af9.instance:botarium-forge-${minecraft_version}:2.3.4"
        modRuntimeOnly "af9.instance:resourcefullib-forge-${minecraft_version}:2.1.29"
        modRuntimeOnly "af9.instance:resourcefulconfig-forge-${minecraft_version}:2.1.3"
        modRuntimeOnly "af9.instance:kubejs-forge:2001.6.5-build.16"
        modRuntimeOnly "af9.instance:rhino-forge:2001.2.3-build.10"
        modRuntimeOnly "af9.instance:architectury:9.2.14-forge"
    }

    // Mixin refmaps
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'af9.refmap.json'
    config 'af9.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license"      : mod_license,
            "mod_id"           : mod_id,
            "version"          : version,
            "mod_name"         : mod_name,
            "mod_author"       : mod_author,
            "forge_version"    : forge_version.split("\\.")[0],
            "minecraft_version": minecraft_version,
            "gtceu_version"    : gtceu_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes(['MixinConfigs': 'af9.mixins.json'])
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(17)
}
