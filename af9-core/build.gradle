plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
        }
    }
    maven { // Curios (GT's Rubber Gloves go in its hands slot)
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven { // Ad Astra (the orbital station's magnetic field sets gravity through its API)
        name = 'Resourceful'
        url = 'https://maven.teamresourceful.com/repository/maven-public/'
        content {
            includeGroup 'earth.terrarium.adastra'
        }
    }
    maven { // AE2 (ME networks need computation: the ME Computation Link, the channel cap)
        name = 'Modmaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
        }
    }
    maven { // Jade (the same coordinates GTCEu builds against)
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // GregTech and the libraries its API exposes
    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    // Jade tooltips of the AF9 machines (the pack runs a newer 11.x; the API used here is unchanged)
    modCompileOnly("maven.modrinth:jade:${jade_version}")
    // gloves worn in a Curios slot protect wafers too (optional at runtime)
    modCompileOnly("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    // the orbital station's magnetic field (optional at runtime)
    modCompileOnly("earth.terrarium.adastra:ad_astra-forge-${minecraft_version}:${ad_astra_version}") { transitive = false }
    // ME networks need computation (optional at runtime: without AE2 none of it loads)
    modCompileOnly("appeng:appliedenergistics2-forge:${ae2_version}") { transitive = false }

    // Mixin refmaps (the Mixins target AE2's own, unobfuscated code)
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'af9.refmap.json'
    config 'af9.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license"      : mod_license,
            "mod_id"           : mod_id,
            "version"          : version,
            "mod_name"         : mod_name,
            "mod_author"       : mod_author,
            "forge_version"    : forge_version.split("\\.")[0],
            "minecraft_version": minecraft_version,
            "gtceu_version"    : gtceu_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes(['MixinConfigs': 'af9.mixins.json'])
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(17)
}
