plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

tasks.register('bumpVersion') {
    doLast {
        def content = file('gradle.properties').text
        def versionLine = content.split(/\r?\n/).find { it.trim().startsWith('mod_version=') }
        if (versionLine) {
            def versionPart = versionLine.trim().split('=')[1]
            def parts = versionPart.split('\\.')
            if (parts.size() >= 3) {
                def major = parts[0] as int
                def minor = parts[1] as int
                def patch = (parts[2] as int) + 1
                def newContent = content.replace(versionLine, "mod_version=${major}.${minor}.${patch}")
                file('gradle.properties').write newContent
                println "Version bumped to ${major}.${minor}.${patch}"
            } else {
                throw new GradleException("Invalid version format: ${versionPart}")
            }
        } else {
            throw new GradleException("mod_version not found in gradle.properties")
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest.attributes(['MixinConfigs': 'af9.mixins.json'])
    // Bump version before building the jar
    dependsOn 'bumpVersion'
    finalizedBy 'reobfJar'
}

repositories {
    // dev runs only: jars of a pack instance (-Paf9Instance=<its folder>), see the runs below
    if (project.hasProperty('af9Instance')) {
        flatDir { dirs "${project.property('af9Instance')}/mods" }
    }
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
        }
    }
    maven { // Curios (GT's Rubber Gloves go in its hands slot)
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven { // Ad Astra (the orbital station's magnetic field sets gravity through its API)
        name = 'Resourceful'
        url = 'https://maven.teamresourceful.com/repository/maven-public/'
        content {
            includeGroup 'earth.terrarium.adastra'
        }
    }
    maven { // Jade (the same coordinates GTCEu builds against)
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

// GregTech: the AF9 fork (gtceu_fork_version, built from ../gtceu-fork: upstream's release plus the patches there) is the
// dependency AF9 Core is built against. Where it is not in mavenLocal yet, or was published from other patches, this build publishes it first (gtceu-fork/build.sh);
// gtceu_fork_maven names another maven (a URL or a folder) to take it from instead. -Paf9SkipForkBuild skips building it and
// falls back to the release it is based on (gtceu_version, from the GTCEu maven; AF9 Core only uses GT's released API, so that
// compiles too), -Paf9RequireFork stops the build where the fork is missing.
def gtceuFork = project.findProperty('gtceu_fork_version')
def forkMaven = project.findProperty('gtceu_fork_maven')
if (forkMaven) {
    repositories {
        maven {
            name = 'GTCEu AF9 fork'
            url = forkMaven
            content { includeGroup 'com.gregtechceu.gtceu' }
        }
    }
}
def forkPath = "com/gregtechceu/gtceu/gtceu-${minecraft_version}/${gtceuFork}"
def forkSources = ['../gtceu-fork/upstream.properties'] + (file('../gtceu-fork/patches').listFiles()?.findAll { it.name.endsWith('.patch') }?.sort { it.name }?.collect { it.path } ?: [])
def forkStamp = java.security.MessageDigest.getInstance('SHA-256').with { md ->
    forkSources.each { md.update(file(it).bytes) }
    md.digest().encodeHex().toString()
}
def forkStampFile = new File(repositories.getByName('MavenLocal').url.path, "${forkPath}/af9-fork.stamp")
def forkAvailable = {
    // published from these patches, or taken from another maven
    (forkStampFile.exists() && forkStampFile.text.trim() == forkStamp) ||
            (forkMaven && (forkMaven.startsWith('http') || new File(forkMaven, forkPath).isDirectory()))
}
def forkScript = file('../gtceu-fork/build.sh')
if (gtceuFork && !forkAvailable() && !project.hasProperty('af9SkipForkBuild') && forkScript.exists()) {
    logger.lifecycle("Building the AF9 fork of GTCEu ${gtceuFork} (gtceu-fork/build.sh)")
    // the child's output goes through this build's log (the daemon's own stdout is not the console)
    def proc = new ProcessBuilder('bash', forkScript.absolutePath, gtceuFork).redirectErrorStream(true).start()
    proc.inputStream.eachLine { logger.lifecycle(it) }
    if (proc.waitFor() != 0) throw new GradleException("building the GTCEu fork ${gtceuFork} failed")
    forkStampFile.parentFile.mkdirs()
    forkStampFile.text = forkStamp
}
def gtceuForkPublished = gtceuFork && forkAvailable()
if (project.hasProperty('af9RequireFork') && !gtceuForkPublished) {
    throw new GradleException("GTCEu ${gtceuFork} (the AF9 fork) is not in mavenLocal or gtceu_fork_maven, and the build requires it")
}
ext.gtceu_build_version = gtceuForkPublished ? gtceuFork : gtceu_version
logger.lifecycle(gtceuForkPublished ? "Building against the AF9 fork of GTCEu ${gtceuFork}" :
        "GTCEu ${gtceuFork} is not available: building against GTCEu ${gtceu_version}")

version = project.findProperty('mod_version') ?: '0.1.0'
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

sourceSets {
    // compile only, not in the jar: the few signatures of Powah that the mixins of AF9 Core (com.af9.core.mixin.powah) name
    stubs {
        java.srcDir 'src/stubs/java'
    }
    // dev runs only, not in the jar: writes down what the game has registered (RegistryDump)
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    devtestImplementation.extendsFrom implementation
    devtestRuntimeOnly.extendsFrom runtimeOnly
}

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version
    addModdingDependenciesTo(sourceSets.devtest)
    addModdingDependenciesTo(sourceSets.stubs)

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.devtest)
        }
    }

    runs {
        // A headless boot for checking what AF9 Core registers: mod loading, the registries, common setup and a server's
        // data packs, then it stops (no window, no world kept). Needs the mods AF9 Core depends on at runtime, and takes
        // KubeJS along, so the pack's scripts in run/kubejs are loaded as well:
        //   ./gradlew runGameTestServer -Paf9Instance=<folder of a pack instance> [-Paf9Dump=<file>]
        // It writes the list of what AF9 Core registers for the linters (tools/lint/data/af9-registry.txt) and, with
        // af9Dump, everything the game has registered to that file (devtest source set, RegistryDump).
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = file('run')
            systemProperty 'af9.dump', (project.findProperty('af9Dump') ?: '').toString()
            systemProperty 'af9.registry', file('../tools/lint/data/af9-registry.txt').absolutePath
        }
    }
}

dependencies {
    // GregTech and the libraries its API exposes
    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_build_version}:slim") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    // Jade tooltips of the AF9 machines (the pack runs a newer 11.x; the API used here is unchanged)
    modCompileOnly("maven.modrinth:jade:${jade_version}")
    // gloves worn in a Curios slot protect wafers too (optional at runtime)
    modCompileOnly("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    // the orbital station's magnetic field (optional at runtime)
    modCompileOnly("earth.terrarium.adastra:ad_astra-forge-${minecraft_version}:${ad_astra_version}") { transitive = false }
    // org.jetbrains.annotations on the staged recipe API: GT depends on them but its jar is transitive = false
    compileOnly 'org.jetbrains:annotations:24.1.0'

    // dev runs only: the mods AF9 Core needs at runtime that are not on a maven above, taken from a pack instance
    if (project.hasProperty('af9Instance')) {
        modRuntimeOnly("earth.terrarium.adastra:ad_astra-forge-${minecraft_version}:${ad_astra_version}") { transitive = false }
        modRuntimeOnly "af9.instance:botarium-forge-${minecraft_version}:2.3.4"
        modRuntimeOnly "af9.instance:resourcefullib-forge-${minecraft_version}:2.1.29"
        modRuntimeOnly "af9.instance:resourcefulconfig-forge-${minecraft_version}:2.1.3"
        modRuntimeOnly "af9.instance:kubejs-forge:2001.6.5-build.16"
        modRuntimeOnly "af9.instance:rhino-forge:2001.2.3-build.10"
        modRuntimeOnly "af9.instance:architectury:9.2.14-forge"
        // Powah, when the instance has it: the mixins of com.af9.core.mixin.powah are applied to its classes in the dev run
        if (file("${project.property('af9Instance')}/mods/Powah-5.0.11.jar").exists()) {
            modRuntimeOnly "af9.instance:Powah:5.0.11"
            modRuntimeOnly "af9.instance:cloth-config:11.1.136-forge"
        }
    }

    // Powah's signatures for the mixins (compile only)
    compileOnly sourceSets.stubs.output

    // Mixin refmaps
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'af9.refmap.json'
    config 'af9.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license"      : mod_license,
            "mod_id"           : mod_id,
            "version"          : version,
            "mod_name"         : mod_name,
            "mod_author"       : mod_author,
            "forge_version"    : forge_version.split("\\.")[0],
            "minecraft_version": minecraft_version,
            "gtceu_version"    : gtceu_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(17)
}
