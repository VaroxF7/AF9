org.gradle.jvmargs=-Xmx2G

# Base properties
minecraft_version=1.20.1
forge_version=47.4.0
mapping_version=2023.09.03

# Mod properties
mod_version=0.1.14
maven_group=com.af9.core
archives_base_name=af9-core
mod_id=af9
mod_name=AF9 Core
mod_author=VaroxF7
mod_license=All Rights Reserved

# Dependencies - pinned to the exact versions GTCEu 7.5.3 was built against (the version AF9 runs)
gtceu_version=7.5.3
# the AF9 fork of GTCEu (layered crafting on top of 7.5.3): the dependency AF9 Core compiles against, built from ../gtceu-fork
# (upstream's release plus the patches there) and published to mavenLocal by the build itself where it is not there yet.
# Raise the version after a change to the patches. gtceu_fork_maven takes it from another maven (a URL or a folder) instead.
gtceu_fork_version=7.5.3-af9.7
gtceu_fork_maven=
ldlib_version=1.0.40.b
registrate_version=MC1.20-1.3.11
configuration_version=2.2.0
jade_version=11.6.3
curios_version=5.14.1+1.20.1
ad_astra_version=1.15.20
