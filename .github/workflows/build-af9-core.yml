name: Build AF9 Core

# Runs on pushes to main (and by hand from the Actions tab).
# 0. lint:    tools/lint (recipes, multiblocks, quests, textures, lang) and its self-test; an error stops the build
# 1. build:   builds the GTCEu fork (gtceu-fork/, artifact "gtceu-fork") and the AF9 Core mod (af9-core/, artifact "af9-core")
# 2. package: artifact "AF9-update": mods/af9-core-*.jar + mods/gtceu-*.jar (the fork) + kubejs/ and config/ from this commit + AF9_BUILD.txt (the commit).
#             Extract it into the instance folder (next to mods/) and let it overwrite.
on:
  push:
    branches:
      - main
    paths:
      - 'af9-core/**'
      - 'gtceu-fork/**'
      - 'kubejs/**'
      - 'config/**'
      - 'tools/lint/**'
      - '.github/workflows/build-af9-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint recipes, multiblocks, quests, assets
        run: bash tools/lint/run.sh --selftest

  build:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: af9-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          # the build publishes the fork (gtceu-fork/) to mavenLocal first and compiles against it
          ./gradlew build -Paf9RequireFork

      - uses: actions/upload-artifact@v4
        with:
          name: af9-core
          path: af9-core/build/libs/*.jar
          if-no-files-found: error

      # the fork the build published to mavenLocal: the pack runs it instead of the GTCEu release
      - name: Collect the GTCEu fork jar
        run: |
          version="$(grep '^gtceu_fork_version=' gradle.properties | cut -d= -f2)"
          mkdir -p ../fork-jar
          find ~/.m2/repository/com/gregtechceu/gtceu -name "gtceu-*-${version}.jar" | head -1 | xargs -I{} cp {} ../fork-jar/
          ls -l ../fork-jar

      - uses: actions/upload-artifact@v4
        with:
          name: gtceu-fork
          path: fork-jar/*.jar
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: af9-core
          path: jar

      - uses: actions/download-artifact@v4
        with:
          name: gtceu-fork
          path: fork

      - name: Assemble the instance update
        run: |
          mkdir -p update/mods
          cp fork/*.jar update/mods/
          cp "$(ls jar/*.jar | grep -vE -- '-(sources|dev|slim)\.jar$' | head -1)" update/mods/
          cp -r kubejs config update/
          # which build this is: the file lands in the instance folder with the rest, so you can tell what you run
          {
            echo "AF9 update"
            echo "commit:  ${GITHUB_SHA}"
            echo "branch:  ${GITHUB_REF_NAME}"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git log -1 --format='subject: %s'
          } > update/AF9_BUILD.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AF9-update
          path: update/
          if-no-files-found: error
