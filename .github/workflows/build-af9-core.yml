name: Build AF9 Core

# Runs on pushes to main (and by hand from the Actions tab).
# 1. build:   builds the AF9 Core mod (af9-core/), artifact "af9-core"
# 2. package: artifact "AF9-update": mods/af9-core-*.jar + kubejs/, config/, defaultconfigs/ from this commit.
#             Extract it into the instance folder (next to mods/) and let it overwrite.
on:
  push:
    branches:
      - main
    paths:
      - 'af9-core/**'
      - 'kubejs/**'
      - 'config/**'
      - 'defaultconfigs/**'
      - '.github/workflows/build-af9-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: af9-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: af9-core
          path: af9-core/build/libs/*.jar
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: af9-core
          path: jar

      - name: Assemble the instance update
        run: |
          mkdir -p update/mods
          cp "$(ls jar/*.jar | grep -vE -- '-(sources|dev|slim)\.jar$' | head -1)" update/mods/
          cp -r kubejs config defaultconfigs update/

      - uses: actions/upload-artifact@v4
        with:
          name: AF9-update
          path: update/
          if-no-files-found: error
