name: Build AF9 Core

# Builds the AF9 Core mod (af9-core/) and uploads the jar as the "af9-core" artifact of the run.
on:
  push:
    paths:
      - 'af9-core/**'
      - '.github/workflows/build-af9-core.yml'
  pull_request:
    paths:
      - 'af9-core/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: af9-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: af9-core
          path: af9-core/build/libs/*.jar
          if-no-files-found: error
