name: Build AF9 Horizon

on:
  push:
    branches: [main, 'claude/**']
    paths: ['af9-lod/**', '.github/workflows/build-af9-lod.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: af9-lod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: af9-lod
          path: af9-lod/build/libs/*.jar
          if-no-files-found: error
