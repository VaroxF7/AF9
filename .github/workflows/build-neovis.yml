name: Build Neovis

# Neovis: AF9's shader mod. A fork of Mekalus (Oculus 1.8.0 for Forge 1.20.1 + Embeddium,
# with the MekaSuit fix) brought closer to current Iris. LGPL-3.0, see neovis/LICENSE.
# It contains no Voxy code: the Voxy port (Noviux) stays local on Janne's PC.
#
# Output: artifact "neovis" with neovis-mc1.20.1-<version>.jar (drop-in replacement for the
# mekalus jar in the instance's mods folder; same mod id "oculus").
on:
  push:
    branches:
      - 'claude/**'
      - main
    paths:
      - 'neovis/**'
      - '.github/workflows/build-neovis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neovis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Collect the mod jar
        run: |
          mkdir -p ../neovis-jar
          ls -l build/libs
          cp "$(ls build/libs/*.jar | grep -vE -- '-(sources|dev|shadow|dev-shadow)\.jar$' | head -1)" ../neovis-jar/
          ls -l ../neovis-jar

      # Forge 1.20.1 runs with SRG names outside dev, so a Neovis mixin that targets a Minecraft
      # method only works if the refmap maps it. Fail the build if the invoker added for the
      # selected-block uniforms is not mapped.
      - name: Check the mixin refmap
        run: |
          python3 - ../neovis-jar/*.jar <<'EOF'
          import json, re, sys, zipfile
          jar = zipfile.ZipFile(sys.argv[1])
          names = [n for n in jar.namelist() if n.endswith("refmap.json")]
          print("refmaps:", names)
          found = None
          for n in names:
              data = json.loads(jar.read(n))
              for table in [data.get("mappings", {})] + list(data.get("data", {}).values()):
                  entry = table.get("net/irisshaders/iris/mixin/GameRendererAccessor", {})
                  if "shouldRenderBlockOutline" in entry:
                      found = entry["shouldRenderBlockOutline"]
          print("GameRendererAccessor.shouldRenderBlockOutline ->", found)
          if not found or not re.search(r"\bm_\d+_", found):
              sys.exit("shouldRenderBlockOutline is not mapped to an SRG name in the refmap")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: neovis
          path: neovis-jar/*.jar
          if-no-files-found: error
