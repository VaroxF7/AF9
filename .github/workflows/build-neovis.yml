name: Build Neovis

# Neovis: AF9's shader mod. A fork of Mekalus (Oculus 1.8.0 for Forge 1.20.1 + Embeddium,
# with the MekaSuit fix) brought closer to current Iris. LGPL-3.0, see neovis/LICENSE.
# It contains no Voxy code: the Voxy port (Noviux) stays local on Janne's PC.
#
# Output: artifact "neovis" with neovis-mc1.20.1-<version>.jar (drop-in replacement for the
# mekalus jar in the instance's mods folder; same mod id "oculus").
on:
  push:
    branches:
      - 'claude/**'
      - main
    paths:
      - 'neovis/**'
      - '.github/workflows/build-neovis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neovis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Collect the mod jar
        run: |
          mkdir -p ../neovis-jar
          ls -l build/libs
          cp "$(ls build/libs/*.jar | grep -vE -- '-(sources|dev|shadow|dev-shadow)\.jar$' | head -1)" ../neovis-jar/
          ls -l ../neovis-jar

      - uses: actions/upload-artifact@v4
        with:
          name: neovis
          path: neovis-jar/*.jar
          if-no-files-found: error
